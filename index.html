  <!--
    Fonts were @import-ed from index.css, which is the worst of both worlds: a chained
    request (fetch and parse the stylesheet before the font stylesheet is even discovered)
    and render-blocking on top of it. On a slow or unreachable font server the page stayed
    blank until it timed out.

    Loaded asynchronously instead — the `media` swap lets the browser treat it as
    non-critical and paint immediately in the fallback face, then restyle when it lands.
    The preconnects mean the handshake is already warm when it does.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Nunito+Sans:wght@400;600;700&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;"
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Nunito+Sans:wght@400;600;700&display=swap" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Nunito+Sans:wght@400;600;700&display=swap" />
